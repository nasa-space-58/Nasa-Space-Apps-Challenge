services:
  rabbitmq:
    image: rabbitmq:4.1.5-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Set user}:${RABBITMQ_PASSWORD:?Set password}@rabbitmq:5672/
      DATA_DIR: /data
      STATE_DIR: /state
      DOCS_DIR: /workspace/docs
      # Optional Q&A assistant; off unless enabled and a key is provided.
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/workspace/backend
      - ./shared:/workspace/shared:ro
      - ./docs:/workspace/docs:ro
      - lunar-data:/data:ro
      - analysis-state:/state
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  data-ingestion:
    restart: on-failure
    build:
      context: .
      dockerfile: data-ingestion/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Set user}:${RABBITMQ_PASSWORD:?Set password}@rabbitmq:5672/
      DATA_DIR: /data
    volumes:
      - ./data-ingestion:/workspace/data-ingestion
      - ./shared:/workspace/shared:ro
      - lunar-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/workspace
      - frontend-modules:/workspace/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  analysis-state:
  lunar-data:
  rabbitmq-data:
  frontend-modules:
